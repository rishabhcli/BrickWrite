name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The browser acceptance run compiles the catalog into a real WebGL context
    # and renders a build guide, so it needs more headroom than the unit suite.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Committed catalog integrity: byte lengths and SHA-256 over every asset
      # the runtime will later verify again before using it as CAD input.
      - name: Verify committed catalog assets
        run: node tools/bootstrap.mjs --verify-only

      - name: Unit tests, strict TypeScript and production build
        run: npm run check

      # Chromium only: the acceptance run drives one browser and starts its own
      # dev server, so the other engines would be pure cost.
      - name: Install Chromium for the acceptance run
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance run
        run: npm run test:e2e

      # The run writes screenshots and the generated build guide; on a failure
      # they are the fastest way to see what the browser actually did.
      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: acceptance-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # Deploys the static build to Cloudflare Pages, which fronts brickwrite.tech.
  # Only after `verify` passes, and only from the default branch, so a red
  # acceptance run cannot reach the domain.
  #
  # Requires two repository secrets: CLOUDFLARE_API_TOKEN (scoped to
  # "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID. The custom domain
  # itself is attached to the Pages project in the Cloudflare dashboard, not
  # from here.
  #
  # Today this ships the ~57MB committed asset pack inside dist/. That is
  # within Pages' limits (largest single file is 1.66MB against a 25MB cap,
  # ~1,800 files against a 20,000 cap), but it is the thing B1 moves to R2
  # when the part library widens and the pack approaches ~900MB.
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=brickwright --branch=main

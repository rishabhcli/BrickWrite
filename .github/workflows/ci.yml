name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Audit production dependencies for high-severity advisories
        run: npm run audit:runtime

      # Committed catalog integrity: byte lengths and SHA-256 over every asset
      # the runtime will later verify again before using it as CAD input.
      - name: Verify committed catalog assets
        run: node tools/bootstrap.mjs --verify-only

      - name: Unit tests, strict TypeScript and production build
        run: npm run check

  # Suites that assert on things a runner cannot change the answer to.
  #
  # `landing` gates the render-critical payload in bytes, `production` executes
  # the built bundle, `share` exercises publication. None of them depend on
  # having a GPU, so a red leg here is a real regression and this is what the
  # deploy waits on.
  acceptance:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One failing suite must not cancel the others: the whole point of the
      # split is learning about every regression in one run.
      fail-fast: false
      matrix:
        suite: [landing, production, share]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify committed catalog assets
        run: node tools/bootstrap.mjs --verify-only

      # `production` serves dist/ rather than Vite's module graph, so it needs a
      # build. Building on every leg costs a minute and keeps the legs identical.
      - name: Build production assets
        run: npm run build

      # Chromium only: the acceptance run drives one browser, so the other
      # engines would be pure cost.
      - name: Install Chromium for the acceptance run
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance run — ${{ matrix.suite }}
        run: npm run test:e2e:all -- ${{ matrix.suite }}

      # The run writes screenshots and the generated build guide; on a failure
      # they are the fastest way to see what the browser actually did.
      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: acceptance-artifacts-${{ matrix.suite }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # Suites that need a GPU, run where there isn't one.
  #
  # A GitHub-hosted runner has no graphics hardware, so Chromium rasterises
  # WebGL through SwiftShader. That is not a small penalty: 3.16 M triangles
  # cost ~9.6 s a frame, and the editor suite's project fork blew a 90 s budget
  # that is already ten times what a laptop needs. Both suites failed every
  # hosted run, for that reason and only that reason, and no amount of raising
  # individual timeouts fixes it — the editor suite alone has around a hundred
  # assertions, any of which is the next one to time out.
  #
  # So they run here for signal and do not hold the door. Their real enforcement
  # is `npm run verify:all` on a machine with a GPU, where the timing targets
  # mean something; `tools/e2e/renderer.mjs` detects the software rasteriser and
  # says on its own line which gates it did not enforce.
  #
  # This is a deliberate narrowing of what CI can promise, not an accident. If
  # these should block again, the fix is a runner with a GPU, not a longer
  # timeout.
  acceptance-gpu:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e-smoke, renderer]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify committed catalog assets
        run: node tools/bootstrap.mjs --verify-only

      # `production` serves dist/ rather than Vite's module graph, so it needs a
      # build. Building on every leg costs a minute against a twenty-minute
      # suite and keeps the legs identical.
      - name: Build production assets
        run: npm run build

      # Chromium only: the acceptance run drives one browser, so the other
      # engines would be pure cost.
      - name: Install Chromium for the acceptance run
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance run — ${{ matrix.suite }}
        run: npm run test:e2e:all -- ${{ matrix.suite }}

      # The run writes screenshots and the generated build guide; on a failure
      # they are the fastest way to see what the browser actually did.
      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: acceptance-artifacts-${{ matrix.suite }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # Deploys the static build to Cloudflare Pages, which fronts brickwrite.tech.
  # Only after every gate passes, and only from the default branch, so a red
  # acceptance run cannot reach the domain.
  #
  # Requires two repository secrets: CLOUDFLARE_API_TOKEN (scoped to
  # "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID. The custom domain
  # itself is attached to the Pages project in the Cloudflare dashboard, and the
  # edge proxy's BRICKWRIGHT_PROXY_SECRET is a Pages project secret — neither is
  # set from here. See docs/deployment.md.
  #
  # `npm run build` measures and gates dist/ against explicit total, file-count,
  # and single-file budgets. Cloudflare's current hard limits remain documented
  # in docs/deployment.md; unlike the old prose-only figures, the gate cannot go
  # stale unnoticed after a catalogue rebuild.
  deploy:
    needs: [verify, acceptance]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build production assets
        run: npm run build
        env:
          # Both values are public browser configuration. The project id stays
          # in Actions secrets so it has one source of truth with Hexclave. A
          # build without them is a working CAD editor with no account layer,
          # which is a supported mode and therefore fails quietly.
          VITE_HEXCLAVE_PROJECT_ID: ${{ secrets.HEXCLAVE_PROJECT_ID }}
          VITE_CONVEX_URL: https://tangible-toucan-87.convex.cloud
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned to the version this deployment was proven against. The action
          # otherwise floats, and `wrangler.toml` here carries a Pages output
          # directory and a compatibility date that older majors do not read the
          # same way.
          wranglerVersion: '4.127.1'
          command: pages deploy dist --project-name=brickwright --branch=main

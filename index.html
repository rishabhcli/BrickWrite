<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d0e" />
    <meta name="description" content="Brickwright — agent-native CAD for physically buildable brick models." />
    <!-- The shell retitles per route once it mounts. This is what the tab
         says before that and on any surface the shell does not own, such as
         the hosted sign-in page — so it should name the product, not one of
         its screens. -->
    <title>Brickwright</title>
    <link
      rel="preload"
      href="/node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The face the landing headline is set in (studio.css:165). Without this
         it is discovered only once React has mounted and laid the h1 out, which
         put it last on the wire, behind the entry chunk and every hero
         thumbnail; with font-display: swap that is a headline which paints in a
         fallback and then reflows. crossorigin is required - a font preload
         without it is fetched twice and buys nothing. -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
